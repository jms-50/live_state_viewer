[package]
name = "LiveStateViewer"
version = "0.1.0"
edition = "2024"

[dependencies]
sysinfo = "0.39.6" 
clap = { version = "4.6.4", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"

[profile.release]
opt-level = "z"    
lto = true         
codegen-units = 1  
strip = true       
panic = "abort"    